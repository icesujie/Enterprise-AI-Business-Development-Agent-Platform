[project]
name = "sari-arta-api"
version = "0.1.0"
description = "FastAPI backend for the Sari Arta AI business development MVP"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "openai-agents>=0.14,<0.15",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pip-tools>=7.4,<8",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["sari_api"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
