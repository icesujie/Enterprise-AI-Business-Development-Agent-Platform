name: sari-arta-ai-bd

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sariarta
      POSTGRES_USER: sariarta
      POSTGRES_PASSWORD: sariarta_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sariarta -d sariarta"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      APP_ENVIRONMENT: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://sariarta:sariarta_dev@postgres:5432/sariarta
      REDIS_URL: redis://redis:6379/0
      AUTH_ISSUER: https://local.supabase.example/auth/v1
      AUTH_AUDIENCE: authenticated
      AUTH_JWKS_URL: https://local.supabase.example/auth/v1/.well-known/jwks.json
      DEVELOPMENT_AUTH_SUBJECT: 30000000-0000-4000-8000-000000000001
      PUBLIC_SITE_TOKEN: local-public-site-token
      PUBLIC_TENANT_ID: 10000000-0000-4000-8000-000000000001
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    profiles: ["app"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["python", "-m", "sari_api.worker"]
    environment:
      APP_ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://sariarta:sariarta_dev@postgres:5432/sariarta
      REDIS_URL: redis://redis:6379/0
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      APP_ENVIRONMENT: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_BASE_URL: http://api:8000
      DEVELOPMENT_AUTH_SUBJECT: 30000000-0000-4000-8000-000000000001
      DEMO_AUTH_EMAIL: ${DEMO_AUTH_EMAIL:-admin@sariarta.local}
      DEMO_AUTH_PASSWORD: ${DEMO_AUTH_PASSWORD:-SariArtaDemo2026!}
      DEMO_AUTH_SECRET: ${DEMO_AUTH_SECRET:-local-demo-session-secret-change-before-shared-use}
      PUBLIC_SITE_TOKEN: local-public-site-token
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
